<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern markdown editor with live preview, syntax highlighting, and export features">
    <title>Markdown Editor - Live Preview & Export</title>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <!-- Highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Turndown.js for HTML to Markdown conversion -->
    <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">📝 Markdown Editor</h1>
                <div class="header-actions">
                    <button id="darkModeToggle" class="btn btn-icon" title="Toggle dark mode">
                        🌙
                    </button>
                </div>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <button id="modeToggle" class="btn btn-primary" title="Toggle editor mode">
                    📝 Switch to Rich Text
                </button>
                <button id="clearBtn" class="btn btn-secondary" title="Clear editor">
                    🗑️ Clear
                </button>
            </div>

            <!-- Rich text formatting toolbar (hidden by default) -->
            <div id="richTextToolbar" class="toolbar-group rich-text-toolbar" style="display: none;">
                <select id="headingSelect" class="btn-select" title="Select heading level">
                    <option value="p">Normal</option>
                    <option value="h1">Heading 1</option>
                    <option value="h2">Heading 2</option>
                    <option value="h3">Heading 3</option>
                    <option value="h4">Heading 4</option>
                    <option value="h5">Heading 5</option>
                    <option value="h6">Heading 6</option>
                </select>
                <button id="boldBtn" class="btn btn-icon" title="Bold"><b>B</b></button>
                <button id="italicBtn" class="btn btn-icon" title="Italic"><i>I</i></button>
                <button id="underlineBtn" class="btn btn-icon" title="Underline"><u>U</u></button>
                <button id="strikeBtn" class="btn btn-icon" title="Strikethrough"><s>S</s></button>
                <div class="divider"></div>
                <button id="bulletListBtn" class="btn btn-icon" title="Bullet list">• List</button>
                <button id="numberListBtn" class="btn btn-icon" title="Numbered list">1. List</button>
                <button id="checkListBtn" class="btn btn-icon" title="Checklist">☑ List</button>
                <div class="divider"></div>
                <button id="linkBtn" class="btn btn-icon" title="Insert link">🔗</button>
                <button id="imageBtn" class="btn btn-icon" title="Insert image">🖼️</button>
                <button id="tableBtn" class="btn btn-icon" title="Insert table">📊</button>
                <button id="codeBlockBtn" class="btn btn-icon" title="Code block">&lt;/&gt;</button>
            </div>

            <div class="toolbar-group">
                <button id="downloadMdBtn" class="btn" title="Download as Markdown">
                    ⬇️ .md
                </button>
                <button id="downloadHtmlBtn" class="btn" title="Download as HTML">
                    ⬇️ .html
                </button>
                <button id="copyMdBtn" class="btn" title="Copy markdown to clipboard">
                    📋 Copy MD
                </button>
                <button id="copyHtmlBtn" class="btn" title="Copy HTML to clipboard">
                    📋 Copy HTML
                </button>
            </div>
        </div>

        <!-- Main content area -->
        <main class="main-content">
            <!-- Editor pane -->
            <div class="editor-pane">
                <div class="pane-header">
                    <h2 id="editorModeLabel">Markdown Editor</h2>
                    <span class="status" id="saveStatus">Auto-save enabled</span>
                </div>
                <textarea
                    id="editor"
                    class="editor-textarea"
                    placeholder="Start typing your markdown here..."
                    spellcheck="false"
                ></textarea>
                <!-- Rich text editor (hidden initially) -->
                <div id="richTextEditor"
                     class="rich-text-editor"
                     contenteditable="true"
                     style="display: none;"
                     spellcheck="true"></div>
            </div>

            <!-- Resizer -->
            <div class="resizer"></div>

            <!-- Preview pane -->
            <div class="preview-pane">
                <div class="pane-header">
                    <h2>Preview</h2>
                </div>
                <div id="preview" class="preview-content"></div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Built with ❤️ using Marked.js & Highlight.js | Press Ctrl+S to download</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="markdown-parser.js"></script>
    <script src="rich-text-editor.js"></script>
    <script src="app.js"></script>
</body>
</html>
