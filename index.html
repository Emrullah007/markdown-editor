<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern markdown editor with live preview, syntax highlighting, and export features">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;">
    <title>Markdown Editor - Live Preview & Export</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <!-- Highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Turndown.js for HTML to Markdown conversion -->
    <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js"></script>

    <!-- DOMPurify for XSS protection -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-title">
                    <h1 class="logo">📝 Markdown Editor</h1>
                    <p class="header-description">Write in Markdown or Rich Text • Live Preview • Export Anywhere</p>
                </div>
                <div class="header-actions">
                    <button id="darkModeToggle" class="btn btn-icon" title="Toggle dark mode">
                        🌙
                    </button>
                </div>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <button id="modeToggle" class="btn btn-primary" title="Toggle editor mode">
                    📝 Switch to Rich Text
                </button>
                <button id="clearBtn" class="btn btn-secondary" title="Clear editor">
                    🗑️ Clear
                </button>
            </div>

            <div class="toolbar-group">
                <button id="downloadMdBtn" class="btn" title="Download as Markdown">
                    <span class="icon">⬇️</span> Download MD
                </button>
                <button id="downloadHtmlBtn" class="btn" title="Download as HTML">
                    <span class="icon">⬇️</span> Download HTML
                </button>
                <button id="copyMdBtn" class="btn" title="Copy markdown to clipboard">
                    <span class="icon">📋</span> Copy MD
                </button>
                <button id="copyHtmlBtn" class="btn" title="Copy HTML to clipboard">
                    <span class="icon">📋</span> Copy HTML
                </button>
            </div>
        </div>

        <!-- Rich text formatting toolbar (hidden by default) -->
        <div id="richTextToolbar" class="rich-text-toolbar-wrapper" style="display: none;">
            <div class="rich-text-toolbar-content">
                <div class="toolbar-section">
                    <label class="toolbar-label">Format</label>
                    <select id="headingSelect" class="btn-select" title="Select heading level">
                        <option value="p">Normal</option>
                        <option value="h1">Heading 1</option>
                        <option value="h2">Heading 2</option>
                        <option value="h3">Heading 3</option>
                        <option value="h4">Heading 4</option>
                        <option value="h5">Heading 5</option>
                        <option value="h6">Heading 6</option>
                    </select>
                    <button id="boldBtn" class="btn btn-icon" title="Bold"><b>B</b></button>
                    <button id="italicBtn" class="btn btn-icon" title="Italic"><i>I</i></button>
                    <button id="underlineBtn" class="btn btn-icon" title="Underline"><u>U</u></button>
                    <button id="strikeBtn" class="btn btn-icon" title="Strikethrough"><s>S</s></button>
                </div>
                <div class="divider"></div>
                <div class="toolbar-section">
                    <label class="toolbar-label">Lists</label>
                    <button id="bulletListBtn" class="btn btn-icon" title="Bullet list">
                        <span class="icon">•</span> List
                    </button>
                    <button id="numberListBtn" class="btn btn-icon" title="Numbered list">
                        <span class="icon">1.</span> List
                    </button>
                    <button id="checkListBtn" class="btn btn-icon" title="Checklist">
                        <span class="icon">☑</span> List
                    </button>
                </div>
                <div class="divider"></div>
                <div class="toolbar-section">
                    <label class="toolbar-label">Insert</label>
                    <button id="linkBtn" class="btn btn-icon" title="Insert link">
                        <span class="icon">🔗</span> Link
                    </button>
                    <button id="imageBtn" class="btn btn-icon" title="Insert image">
                        <span class="icon">🖼️</span> Image
                    </button>
                    <button id="tableBtn" class="btn btn-icon" title="Insert table">
                        <span class="icon">📊</span> Table
                    </button>
                    <button id="codeBlockBtn" class="btn btn-icon" title="Code block">
                        <span class="icon">&lt;/&gt;</span> Code
                    </button>
                </div>
            </div>
        </div>

        <!-- Main content area -->
        <main class="main-content">
            <!-- Editor pane -->
            <div class="editor-pane">
                <div class="pane-header">
                    <h2 id="editorModeLabel">Markdown Editor</h2>
                    <div class="pane-header-actions">
                        <span class="status" id="saveStatus">Auto-save enabled</span>
                        <button id="editorFullscreenBtn" class="btn-icon-small" title="Toggle editor fullscreen">⛶</button>
                    </div>
                </div>
                <textarea
                    id="editor"
                    class="editor-textarea"
                    placeholder="Start typing your markdown here..."
                    spellcheck="false"
                ></textarea>
                <!-- Rich text editor (hidden initially) -->
                <div id="richTextEditor"
                     class="rich-text-editor"
                     contenteditable="true"
                     style="display: none;"
                     spellcheck="true"></div>
            </div>

            <!-- Resizer -->
            <div class="resizer"></div>

            <!-- Preview pane -->
            <div class="preview-pane">
                <div class="pane-header">
                    <h2>Preview</h2>
                    <button id="previewFullscreenBtn" class="btn-icon-small" title="Toggle preview fullscreen">⛶</button>
                </div>
                <div id="preview" class="preview-content"></div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-left">
                    <span>© 2026 <a href="https://www.emrullahcelik.com/" target="_blank" rel="noopener noreferrer">Emrullah Celik</a></span>
                    <span class="footer-separator">•</span>
                    <a href="https://github.com/Emrullah007/markdown-editor" target="_blank" rel="noopener noreferrer">GitHub</a>
                    <span class="footer-separator">•</span>
                    <a href="https://github.com/Emrullah007/markdown-editor/blob/main/README.md" target="_blank" rel="noopener noreferrer">Documentation</a>
                </div>
                <div class="footer-right">
                    <span class="keyboard-hint">💾 <kbd>Ctrl</kbd>+<kbd>S</kbd> / <kbd>⌘</kbd>+<kbd>S</kbd> to save</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="markdown-parser.js"></script>
    <script src="rich-text-editor.js"></script>
    <script src="app.js"></script>
</body>
</html>
