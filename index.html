<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern markdown editor with live preview, syntax highlighting, and export features">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://vitals.vercel-insights.com;">
    <title>Markdown Editor - Live Preview & Export</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MD Editor">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%232c3e50'/><text x='90' y='120' font-size='90' text-anchor='middle' fill='white'>📝</text></svg>">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Highlight.js for syntax highlighting -->

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-title">
                    <h1 class="logo">📝 Markdown Editor</h1>
                    <p class="header-description">Write in Markdown or Rich Text • Live Preview • Export Anywhere</p>
                </div>
                <div class="header-actions">
                    <button id="findReplaceBtn" class="btn btn-icon" title="Find & Replace (Ctrl+F)" aria-label="Open Find and Replace dialog">
                        🔍
                    </button>
                    <div class="theme-picker">
                        <button id="themePickerBtn" class="theme-picker-btn" title="Change theme" aria-label="Open theme picker" aria-haspopup="true" aria-expanded="false">
                            🎨 Theme
                        </button>
                        <div id="themePickerDropdown" class="theme-picker-dropdown" role="menu" aria-label="Theme options">
                            <button class="theme-option" data-theme="light" role="menuitem">
                                <span class="theme-swatch theme-swatch-light"></span>
                                Light
                            </button>
                            <button class="theme-option" data-theme="dark" role="menuitem">
                                <span class="theme-swatch theme-swatch-dark"></span>
                                Dark
                            </button>
                            <button class="theme-option" data-theme="ocean" role="menuitem">
                                <span class="theme-swatch theme-swatch-ocean"></span>
                                Ocean
                            </button>
                            <button class="theme-option" data-theme="forest" role="menuitem">
                                <span class="theme-swatch theme-swatch-forest"></span>
                                Forest
                            </button>
                            <button class="theme-option" data-theme="sunset" role="menuitem">
                                <span class="theme-swatch theme-swatch-sunset"></span>
                                Sunset
                            </button>
                            <button class="theme-option" data-theme="lavender" role="menuitem">
                                <span class="theme-swatch theme-swatch-lavender"></span>
                                Lavender
                            </button>
                            <button class="theme-option" data-theme="rose" role="menuitem">
                                <span class="theme-swatch theme-swatch-rose"></span>
                                Rose
                            </button>
                            <button class="theme-option" data-theme="mint" role="menuitem">
                                <span class="theme-swatch theme-swatch-mint"></span>
                                Mint
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <button id="modeToggle" class="btn btn-primary" title="Toggle editor mode" aria-label="Switch to Rich Text editor mode">
                    📝 Switch to Rich Text
                </button>
                <button id="clearBtn" class="btn btn-secondary" title="Clear editor" aria-label="Clear all editor content">
                    🗑️ Clear
                </button>
                <button id="resetBtn" class="btn btn-secondary" title="Reset to default starter content (draft is saved)" aria-label="Reset to default starter content">
                    🔄 Reset to Default
                </button>
                <button id="restoreBtn" class="btn btn-secondary" title="Restore your cached draft" aria-label="Restore your cached draft">
                    ♻️ Restore Draft
                </button>
            </div>

            <div class="toolbar-group">
                <button id="undoBtn" class="btn btn-icon" title="Undo (Ctrl+Z)" aria-label="Undo last change" disabled>
                    <span class="icon" aria-hidden="true">↶</span> Undo
                </button>
                <button id="redoBtn" class="btn btn-icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo last undone change" disabled>
                    <span class="icon" aria-hidden="true">↷</span> Redo
                </button>
            </div>

            <div class="toolbar-group">
                <button id="importMdBtn" class="btn" title="Import Markdown file" aria-label="Import Markdown file from disk">
                    <span class="icon" aria-hidden="true">📂</span> Import
                </button>
                <button id="downloadMdBtn" class="btn" title="Download as Markdown" aria-label="Download document as Markdown file">
                    <span class="icon" aria-hidden="true">⬇️</span> Download MD
                </button>
                <button id="downloadPdfBtn" class="btn" title="Download as PDF" aria-label="Download document as PDF file">
                    <span class="icon" aria-hidden="true">📄</span> Download PDF
                </button>
                <button id="copyMdBtn" class="btn" title="Copy markdown to clipboard" aria-label="Copy markdown to clipboard">
                    <span class="icon" aria-hidden="true">📋</span> Copy MD
                </button>
                <button id="copyHtmlBtn" class="btn" title="Copy HTML to clipboard" aria-label="Copy HTML to clipboard">
                    <span class="icon" aria-hidden="true">📋</span> Copy HTML
                </button>
            </div>
        </div>

        <!-- Rich text formatting toolbar (hidden by default) -->
        <div id="richTextToolbar" class="rich-text-toolbar-wrapper" style="display: none;">
            <div class="rich-text-toolbar-content">
                <div class="toolbar-section">
                    <label class="toolbar-label" for="headingSelect">Format</label>
                    <select id="headingSelect" class="btn-select" title="Select heading level" aria-label="Select text formatting level">
                        <option value="p">Normal</option>
                        <option value="h1">Heading 1</option>
                        <option value="h2">Heading 2</option>
                        <option value="h3">Heading 3</option>
                        <option value="h4">Heading 4</option>
                        <option value="h5">Heading 5</option>
                        <option value="h6">Heading 6</option>
                    </select>
                    <button id="boldBtn" class="btn btn-icon" title="Bold" aria-label="Make text bold"><b>B</b></button>
                    <button id="italicBtn" class="btn btn-icon" title="Italic" aria-label="Make text italic"><i>I</i></button>
                    <button id="underlineBtn" class="btn btn-icon" title="Underline" aria-label="Underline text"><u>U</u></button>
                    <button id="strikeBtn" class="btn btn-icon" title="Strikethrough" aria-label="Add strikethrough to text"><s>S</s></button>
                </div>
                <div class="divider" role="separator" aria-hidden="true"></div>
                <div class="toolbar-section">
                    <label class="toolbar-label">Lists</label>
                    <button id="bulletListBtn" class="btn btn-icon" title="Bullet list" aria-label="Insert bullet list">
                        <span class="icon" aria-hidden="true">•</span> List
                    </button>
                    <button id="numberListBtn" class="btn btn-icon" title="Numbered list" aria-label="Insert numbered list">
                        <span class="icon" aria-hidden="true">1.</span> List
                    </button>
                    <button id="checkListBtn" class="btn btn-icon" title="Checklist" aria-label="Insert checklist">
                        <span class="icon" aria-hidden="true">☑</span> List
                    </button>
                </div>
                <div class="divider" role="separator" aria-hidden="true"></div>
                <div class="toolbar-section">
                    <label class="toolbar-label">Insert</label>
                    <button id="linkBtn" class="btn btn-icon" title="Insert link" aria-label="Insert hyperlink">
                        <span class="icon" aria-hidden="true">🔗</span> Link
                    </button>
                    <button id="imageBtn" class="btn btn-icon" title="Insert image" aria-label="Insert image">
                        <span class="icon" aria-hidden="true">🖼️</span> Image
                    </button>
                    <button id="tableBtn" class="btn btn-icon" title="Insert table" aria-label="Insert table">
                        <span class="icon" aria-hidden="true">📊</span> Table
                    </button>
                    <button id="codeBlockBtn" class="btn btn-icon" title="Code block" aria-label="Insert code block">
                        <span class="icon" aria-hidden="true">&lt;/&gt;</span> Code
                    </button>
                </div>
            </div>
        </div>

        <!-- Main content area -->
        <main class="main-content">
            <!-- Editor pane -->
            <div class="editor-pane">
                <div class="pane-header">
                    <h2 id="editorModeLabel">Markdown Editor</h2>
                    <div class="pane-header-actions">
                        <span class="status" id="saveStatus" role="status" aria-live="polite">Auto-save enabled</span>
                        <button id="editorFullscreenBtn" class="btn-icon-small" title="Toggle editor fullscreen" aria-label="Toggle editor fullscreen mode">⛶</button>
                    </div>
                </div>
                <textarea
                    id="editor"
                    class="editor-textarea"
                    placeholder="Start typing your markdown here..."
                    spellcheck="false"
                    aria-label="Markdown editor textarea"
                ></textarea>
                <!-- Rich text editor (hidden initially) -->
                <div id="richTextEditor"
                     class="rich-text-editor"
                     contenteditable="true"
                     style="display: none;"
                     spellcheck="true"
                     role="textbox"
                     aria-label="Rich text editor"
                     aria-multiline="true"></div>
            </div>

            <!-- Resizer -->
            <div class="resizer" role="separator" aria-label="Resize editor and preview panes" aria-orientation="vertical"></div>

            <!-- Preview pane -->
            <div class="preview-pane">
                <div class="pane-header">
                    <h2>Preview</h2>
                    <button id="previewFullscreenBtn" class="btn-icon-small" title="Toggle preview fullscreen" aria-label="Toggle preview fullscreen mode">⛶</button>
                </div>
                <div id="preview" class="preview-content"></div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-left">
                    <span>© 2026 <a href="https://www.emrullahcelik.com/" target="_blank" rel="noopener noreferrer">Emrullah Celik</a></span>
                    <span class="footer-separator">•</span>
                    <a href="https://github.com/Emrullah007/markdown-editor" target="_blank" rel="noopener noreferrer">GitHub</a>
                    <span class="footer-separator">•</span>
                    <a href="https://github.com/Emrullah007/markdown-editor/blob/main/README.md" target="_blank" rel="noopener noreferrer">Documentation</a>
                </div>
                <div class="footer-center">
                    <span id="wordCount" class="stats-display" role="status" aria-live="polite">0 words • 0 characters • 0 min read</span>
                </div>
                <div class="footer-right">
                    <span class="keyboard-hint">🔍 <kbd>Ctrl</kbd>+<kbd>F</kbd> Find</span>
                    <span class="keyboard-hint">💾 <kbd>Ctrl</kbd>+<kbd>S</kbd> Save</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="image-storage.js"></script>
    <script src="history-manager.js"></script>
    <script src="markdown-parser.js"></script>
    <script src="rich-text-editor.js"></script>
    <script src="find-replace.js"></script>
    <script src="pdf-export.js"></script>
    <script src="syntax-highlighter.js"></script>
    <script src="table-editor.js"></script>
    <script src="focus-mode.js"></script>
    <script src="auto-pair.js"></script>
    <script src="typewriter-mode.js"></script>
    <script src="statistics-panel.js"></script>
    <script src="templates.js"></script>
    <script src="table-editor.js"></script>
    <script src="spell-checker.js"></script>
    <script src="app.js"></script>
</body>
</html>
